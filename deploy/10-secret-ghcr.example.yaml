# NOT committed -- this file documents the shape of the secret; create it with
# deploy/secrets.sh, which pulls the token from `gh auth token` so no credential
# ever lands in git.
#
# The image is private (ghcr.io/loafoe/* returns 401 anonymously) and no
# ServiceAccount in the cluster carries a pull secret, so a fresh node cannot
# pull it without this.
#
#   kubectl --context <cluster> -n multica create secret docker-registry ghcr \
#     --docker-server=ghcr.io \
#     --docker-username=loafoe \
#     --docker-password="$(gh auth token)" \
#     --dry-run=client -o yaml | kubectl --context <cluster> apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: ghcr
  namespace: multica
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <base64 dockerconfigjson>

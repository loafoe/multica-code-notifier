# multica-code-notifier, deployed alongside multica in the `multica` namespace.
#
# It needs no Service, no Ingress and no Kubernetes API access at all: it holds
# one Postgres connection open (LISTEN) and makes outbound HTTPS calls to the
# Telegram Bot API. Hence automountServiceAccountToken: false -- if this pod is
# ever compromised there is no token mounted for it to escalate with.
#
# replicas MUST stay 1. LISTEN/NOTIFY delivers every notification to every
# listening session, so a second replica would deliver a second copy of the same
# login code to the same Telegram chat. Scaling out needs a dedup step
# (advisory lock keyed on the verification_code row id) that has not been
# written; do not "just bump the replicas".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: multica-code-notifier
  namespace: multica
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multica-code-notifier
  namespace: multica
  labels:
    app.kubernetes.io/name: multica-code-notifier
    app.kubernetes.io/part-of: multica
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: multica-code-notifier
  strategy:
    # Recreate, not RollingUpdate. A rolling update briefly runs two replicas,
    # and with LISTEN that means every login code is delivered to Telegram
    # twice. Exactly the duplication the replicas:1 comment above warns about.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multica-code-notifier
        app.kubernetes.io/part-of: multica
    spec:
      serviceAccountName: multica-code-notifier
      automountServiceAccountToken: false
      # The program returns on the first SIGTERM; it never waits out a long
      # shutdown.
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notifier
          # Digest-pinned. The release workflow runs on every push to main, so
          # the :v0.1.0 tag is MUTABLE; pinning the digest keeps a redeploy from
          # silently changing what runs. Verify before trusting a new one:
          #   cosign verify \
          #     --certificate-identity-regexp '^https://github.com/<owner>/multica-code-notifier/' \
          #     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
          #     ghcr.io/<owner>/multica-code-notifier@sha256:<digest>
          image: ghcr.io/loafoe/multica-code-notifier@sha256:88aeacaa32cc43a1253ec873b43a496969845adfdf0370085958e6ebc4ff20ae
          imagePullPolicy: IfNotPresent
          env:
            # --- Postgres. The default below is the CloudNativePG read-write
            # Service for a Cluster named multica-db in this namespace; for
            # plain Postgres or a managed database, point PGHOST at it.
            - name: PGHOST
              value: multica-db-rw.multica.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: multica
            - name: PGUSER
              value: multica
            # Read live from the Secret the database operator owns rather than
            # keeping a second copy anywhere, so a password rotation does not
            # leave this pod holding a stale credential.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: multica-db-app
                  key: password
            # The connection never leaves the cluster network and the operator
            # serves a self-signed certificate, so verification would need a CA
            # bundle for no benefit. Set to "require" (plus a CA) for a
            # managed database reached over a public network.
            - name: PGSSLMODE
              value: disable
            # --- Telegram
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram
                  key: bot_token
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: telegram
                  key: chat_id
            # Empty = notify for every address. Set this to a comma-separated
            # list as soon as anyone besides the account owner exists, so other
            # users' login codes do not land in this Telegram chat.
            - name: NOTIFY_EMAIL_ALLOWLIST
              value: ""
          # No probes: the process has no HTTP surface, and its one dependency
          # (Telegram) is already verified at startup -- an unreachable bot API
          # makes it exit non-zero and CrashLoopBackOff rather than run
          # silently broken. A liveness probe on a process that reconnects on
          # its own would only add restart churn.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

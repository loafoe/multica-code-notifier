name: Build and Push OCI Images

# ko cross-compiles a static binary for linux/amd64 + linux/arm64, pushes a
# multi-arch index to ghcr.io, and cosign signs the resulting digest keylessly
# via GitHub OIDC -- there is no long-lived signing key on any machine or in the
# repository.
#
# Tagging rules (see the "Resolve version" step for the enforcement):
#
#   push refs/tags/vX.Y.Z    -> publishes the immutable version tag X.Y.Z,
#                                plus `latest` when it is a STABLE release
#   push to main              -> publishes the mutable `main` tag only; it never
#                                touches `latest` or any version tag
#
# A version tag that already exists in the registry is a hard failure. Rebuilding
# a published version is not allowed, because `git tag --force` makes it trivial
# to do by accident and consumers pin tags.
on:
  push:
    branches: ['main']
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write # needed for keyless signing

env:
  REGISTRY: ghcr.io
  # ko's DEFAULT naming is ${KO_DOCKER_REPO}/<package>-<hash-of-import-path>.
  # With --bare below, KO_DOCKER_REPO is used verbatim, so it must be the FULL
  # repository path.
  KO_DOCKER_REPO: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # REQUIRED for ko: at the default fetch-depth: 1 the tag is absent.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ko
        uses: ko-build/setup-ko@v0.6

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      # ghcr.io answers a blob HEAD with 403 (not 404) for a blob that does not
      # exist in a PRIVATE package, and go-containerregistry -- which ko uses to
      # upload -- treats that as a hard error. Packages created by GITHUB_TOKEN
      # inherit the repository's visibility, so this is only correct while the
      # package is PUBLIC. GHCR_TOKEN (a PAT with write:packages) is the escape
      # hatch for a private package.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        env:
          REPO_PATH: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Strict semver, with an optional leading `v`:
          #   MAJOR.MINOR.PATCH  [-prerelease]  [+build]
          # No leading zeros in the numeric fields.
          SEMVER='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            GIT_TAG="${GITHUB_REF#refs/tags/}"
            if ! [[ "$GIT_TAG" =~ $SEMVER ]]; then
              echo "::error::'$GIT_TAG' is not a valid semantic version tag (want vMAJOR.MINOR.PATCH[-prerelease][+build])"
              exit 1
            fi
            TAG="$GIT_TAG"
            VERSION="${GIT_TAG#v}"
            IS_RELEASE=true
            if [[ "$VERSION" == *-* ]]; then
              IS_PRERELEASE=true
            else
              IS_PRERELEASE=false
            fi
          else
            # A plain `main` push is a development build, NOT a release. It gets
            # its own tag and must never be presented as a version.
            TAG="main"
            VERSION="main"
            IS_RELEASE=false
            IS_PRERELEASE=false
          fi

          echo "version=$VERSION"      >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"              >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE"      >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

          # Released versions are immutable. Fetch an anonymous pull token for
          # the check -- a 401 here means "not published", which is the answer
          # we want, and it keeps this step independent of the login token.
          if [ "$IS_RELEASE" = "true" ]; then
            probe=$(curl -fsSL "https://ghcr.io/token?scope=repository:${REPO_PATH}:pull&service=ghcr.io" \
              | jq -r .token || true)
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${probe:-none}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              "https://ghcr.io/v2/${REPO_PATH}/manifests/${TAG}")
            if [ "$code" = "200" ]; then
              echo "::error::${TAG} is already published. Version tags are immutable."
              echo "::error::If this was a mistake, delete the registry tag and the local"
              echo "::error::git tag, push a NEW version instead of force-moving this one."
              exit 1
            fi
            echo "immutability check: ${TAG} not yet published (HTTP $code)"
          fi

          echo "building version=$VERSION tag=$TAG release=$IS_RELEASE prerelease=$IS_PRERELEASE"

      # NOTE: no --sbom. ko uploads the SBOM through go-containerregistry, which
      # HEAD-probes the blob first, and ghcr.io answers a HEAD for a blob that
      # does not exist yet with 403 Forbidden instead of 404 -- an error
      # go-containerregistry treats as fatal. The image push takes a different
      # path and is unaffected. Generate an SBOM locally when one is needed:
      #   KO_DOCKER_REPO=ghcr.io/<owner>/multica-code-notifier \
      #     ko build --sbom-dir sbom --bare --push=false --tags v0.1.0 .
      - name: Build and Push
        id: ko_build
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # --tags takes a BARE TAG; passing a full image reference makes ko
          # prepend its own computed tag and fail with
          # 'repository can only contain the characters ...'
          # --sbom=none: ko publishes SBOMs BY DEFAULT, and that upload path
          # trips over the ghcr 403 described above. --sbom-dir alone does not
          # help -- ko still uploads when --push is on.
          KO_DOCKER_REPO=ghcr.io/${{ github.repository }} ko build \
            --sbom=none \
            --bare \
            --image-refs image-refs.txt \
            --platform=linux/amd64,linux/arm64 \
            --tags="${TAG}" \
            .
          # --image-refs writes one line PER published reference, and every line
          # is UNTAGGED: the multi-arch index digest first, then one manifest
          # digest per platform. Only ko's stdout carries the tag. So take the
          # first line (the index) and re-attach the tag ourselves -- and do not
          # filter on ":${TAG}@", which matches nothing and, under the runner's
          # `bash -e`, kills the step with no error message at all.
          digest=$(head -1 image-refs.txt)
          image="${KO_DOCKER_REPO}@${digest##*@}"
          echo "image-refs.txt has $(wc -l < image-refs.txt) references (index + platforms)"
          echo "signing $image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # Move `latest` onto a stable release by copying the manifest bytes under
      # the new tag. A plain manifest GET/PUT is enough (no blob uploads, the
      # layers already exist) and avoids a second full ko build, which would
      # produce a different digest than the one just signed.
      - name: Move latest (stable releases only)
        if: steps.version.outputs.is_release == 'true' && steps.version.outputs.is_prerelease == 'false'
        env:
          IMAGE: ${{ steps.ko_build.outputs.image }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO_PATH: ${{ github.repository }}
        run: |
          set -euo pipefail
          accept='application/vnd.oci.image.index.v1+json'
          token=$(curl -fsSL "https://ghcr.io/token?scope=repository:${REPO_PATH}:pull,push&service=ghcr.io" | jq -r .token)
          digest="${IMAGE##*@}"
          manifest=$(curl -fsSL \
            -H "Authorization: Bearer $token" -H "Accept: $accept" \
            "https://ghcr.io/v2/${REPO_PATH}/manifests/${digest}")
          curl -fsS -o /dev/null -X PUT \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: $accept" \
            --data-binary "$manifest" \
            "https://ghcr.io/v2/${REPO_PATH}/manifests/latest"
          echo "latest -> ${TAG}@${digest}"

      # Sign the digest ko printed, rather than reconstructing a tag: the output
      # is the exact multi-arch index digest that consumers pull.
      - name: Sign the images
        env:
          IMAGE: ${{ steps.ko_build.outputs.image }}
        run: cosign sign --yes "$IMAGE"

      # Proves the signature is really there and carries the workflow identity,
      # rather than trusting that the sign step succeeded.
      - name: Verify signature
        env:
          IMAGE: ${{ steps.ko_build.outputs.image }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE" | tee cosign-output.txt
          {
            echo "### cosign verify"
            echo '```'
            cat cosign-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`${{ steps.ko_build.outputs.image }}\` |"
            echo "| tag | \`${{ steps.version.outputs.tag }}\` |"
            echo "| release | \`${{ steps.version.outputs.is_release }}\` |"
            echo "| prerelease | \`${{ steps.version.outputs.is_prerelease }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

name: Build and Push OCI Images

# ko cross-compiles a static binary for linux/amd64 + linux/arm64, pushes a
# multi-arch index to ghcr.io, and cosign signs the resulting digest keylessly
# via GitHub OIDC -- there is no long-lived signing key on any machine or in the
# repository.
#
# Mirrors the pattern already used for the other images in this org
# (prometheus-p1-exporter/.github/workflows/build-and-push.yml) so the supply
# chain looks identical across repos.
on:
  push:
    branches: ['main']
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write # needed for keyless signing

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # REQUIRED for ko: at the default fetch-depth: 1 the tag is absent.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ko
        uses: ko-build/setup-ko@v0.6

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      # ghcr.io answers a blob HEAD with 403 (not 404) for a blob that does not
      # exist in a PRIVATE package, and go-containerregistry -- which ko uses to
      # upload -- treats that as a hard error. Packages created by GITHUB_TOKEN
      # inherit the repository's visibility, so in a PRIVATE repository the
      # default token cannot upload anything new; it only succeeds while every
      # layer happens to be cached from an earlier push.
      #
      # So: prefer a PAT (GHCR_TOKEN secret, needs write:packages) and fall back
      # to GITHUB_TOKEN, which is all that is needed once the repository (and
      # therefore the package) is public.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # NOTE: no --sbom. ko uploads the SBOM through go-containerregistry, which
      # HEAD-probes the blob first, and ghcr.io answers a HEAD for a blob that
      # does not exist yet with 403 Forbidden instead of 404 -- an error
      # go-containerregistry treats as fatal. The image push takes a different
      # path and is unaffected. Generate an SBOM locally when one is needed:
      #   KO_DOCKER_REPO=ghcr.io/<owner>/multica-code-notifier \
      #     ko build --sbom-dir sbom --bare --push=false --tags v0.1.0 .
      - name: Build and Push
        id: ko_build
        run: |
          # Determine the tag
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG=latest
          fi

          # Build and push using ko
          # --platform to specify the architectures
          # --bare so KO_DOCKER_REPO is used verbatim as the repository instead
          # of ko's default '<package>-<import-path-hash>' name
          # --tags takes a BARE TAG; passing a full image reference makes ko
          # prepend its own computed tag and fail with
          # 'repository can only contain the characters ...'
          # --image-refs, not $(ko build ...): ko writes the published digest to
          # STDERR, so command substitution captures nothing and cosign is
          # then invoked with zero arguments. Writing the refs to a file is
          # explicit and version-independent.
          # --sbom=none is REQUIRED and is not just an optimisation: ko enables
          # SBOM publishing BY DEFAULT. Its upload path HEAD-probes the SBOM blob
          # first and ghcr.io answers a HEAD for a blob that does not exist with
          # 403 Forbidden rather than 404, which go-containerregistry treats as
          # fatal. Note --sbom-dir alone does not help -- ko still uploads when
          # --push is on. The image push takes a different path and is fine.
          KO_DOCKER_REPO=ghcr.io/${{ github.repository }} ko build \
            --sbom=none \
            --bare \
            --image-refs image-refs.txt \
            --platform=linux/amd64,linux/arm64 \
            --tags="${TAG}" \
            .
          echo "image=$(cat image-refs.txt)" >> "$GITHUB_OUTPUT"

      # Sign the digest ko printed, rather than reconstructing a tag: the output
      # is the exact multi-arch index digest that consumers pull.
      - name: Sign the images
        run: cosign sign --yes ${{ steps.ko_build.outputs.image }}

      # Proves the signature is really there and carries the workflow identity,
      # rather than trusting that the sign step succeeded.
      - name: Verify signature
        env:
          IMAGE: ${{ steps.ko_build.outputs.image }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE" | tee cosign-output.txt
          {
            echo "### cosign verify"
            echo '```'
            cat cosign-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

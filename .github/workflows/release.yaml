name: release

# ko cross-compiles a static binary for linux/amd64 + linux/arm64, emits an SPDX
# SBOM, pushes a multi-arch index to ghcr.io, and cosign signs the index
# digest keylessly using this workflow's GitHub OIDC token -- there is no
# long-lived signing key anywhere, and no ~/.cosign on any machine.
#
# Trigger by pushing a tag; the tag becomes the image tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  # Required for cosign keyless: mints the OIDC token that becomes the
  # Fulcio certificate's identity claim.
  id-token: write

env:
  REGISTRY: ghcr.io
  # ko's DEFAULT naming is ${KO_DOCKER_REPO}/<package>-<hash-of-import-path>,
  # i.e. .../multica-code-notifier-2f7380b8... . Combined with --bare below,
  # KO_DOCKER_REPO is used verbatim, so it must be the FULL repository path.
  KO_DOCKER_REPO: ghcr.io/${{ github.repository }}

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # REQUIRED for ko: with the default fetch-depth: 1 the git tag is not
          # present, so ko falls back to its git-state-derived tag
          # (multica-code-notifier-<sha>) and --tags then conflicts with it.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: sigstore/cosign-installer@v3

      # ko is installed from its GitHub release tarball. The documented
      # `curl https://ko.build/install.sh` is a 404 as of v0.19.1, and the
      # community setup-ko actions have moved/been deleted before -- pinning
      # the release asset keeps the toolchain auditable and reproducible.
      - name: Install ko
        env:
          KO_VERSION: v0.19.1
        run: |
          set -euo pipefail
          # NOTE: the release ASSET drops the leading `v` from the tag
          # (ko_v0.19.1_... for the tag, but ko_0.19.1_... for the file), which
          # is an easy way to get a silent 404 here.
          ASSET="ko_${KO_VERSION#v}_Linux_x86_64.tar.gz"
          WORK="$(mktemp -d)"
          curl -fsSLo "${WORK}/${ASSET}" \
            "https://github.com/ko-build/ko/releases/download/${KO_VERSION}/${ASSET}"
          # Verify the release checksum before running the binary. The check
          # reads the asset by name, so it has to run where the file is.
          curl -fsSL "https://github.com/ko-build/ko/releases/download/${KO_VERSION}/checksums.txt" \
            | grep " ${ASSET}\$" > "${WORK}/checksums.txt"
          ( cd "$WORK" && sha256sum --check checksums.txt )
          tar -C /usr/local/bin -xzf "${WORK}/${ASSET}" ko
          ko version

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Make the tag available to ko as the image tag. ko derives the repository
      # from KO_DOCKER_REPO + the Go import path, and the tag from the git tag.
      - name: Resolve image tag
        id: meta
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch, with SBOM)
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          IMAGE: ${{ env.KO_DOCKER_REPO }}/${{ github.repository }}
        run: |
          # --tags takes a BARE TAG, not a full image reference: passing
          # "$IMAGE:$TAG" makes ko prepend its own computed tag and fails with
          # 'repository can only contain the characters ...'. --bare makes
          # KO_DOCKER_REPO the repository verbatim instead of appending ko's
          # default '<package>-<import-path-hash>' suffix.
          ko build \
            --sbom \
            --bare \
            --platform=linux/arm64,linux/amd64 \
            --tags "$TAG" \
            .

      # Sign the index, not the per-platform manifests: a consumer verifies the
      # digest it pulls, and signing only the arch-specific manifests would
      # leave the multi-arch index itself unsigned.
      - name: Sign (keyless)
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          IMAGE: ${{ env.KO_DOCKER_REPO }}/${{ github.repository }}
        run: cosign sign --yes "$IMAGE:$TAG"

      # Proves the signature is actually there and carries the workflow
      # identity, rather than trusting that the sign step succeeded.
      - name: Verify signature
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          IMAGE: ${{ env.KO_DOCKER_REPO }}/${{ github.repository }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE:$TAG" | tee cosign-output.txt
          # Surface the digest + signature in the job summary so it is visible
          # without re-running cosign locally.
          {
            echo "### cosign"
            echo '```'
            cat cosign-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify
        if: success()
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          IMAGE: ${{ env.KO_DOCKER_REPO }}/${{ github.repository }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg t "$IMAGE:$TAG" \
                 '{text: "multica-code-notifier published and signed: " + $t}')" \
            "$SLACK_WEBHOOK_URL"

# NOT committed -- this file documents the shape of the secret; create it with
# deploy/secrets.sh, which pulls the token from `gh auth token` so no credential
# ever lands in git.
#
# The image is published under a private registry namespace (ghcr.io returns
# 401 anonymously), and clusters frequently have no default registry credential:
# nodes only hold images cached at build time, so a cold node fails the pull and
# the pod lands in ErrImagePull even though the repository exists.
#
#   kubectl -n multica create secret docker-registry ghcr \
#     --docker-server=ghcr.io \
#     --docker-username=<github-user> \
#     --docker-password="$(gh auth token)" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: ghcr
  namespace: multica
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <base64 dockerconfigjson>
